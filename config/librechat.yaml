version: 1.3.13
cache: true

interface:
  customWelcome: '欢迎使用沃达跨境电商AI平台'
  fileSearch: false
  modelSelect: true
  parameters: false
  presets: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  memories: false
  runCode: false
  webSearch: false
  agents:
    use: false
    create: false
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  mcpServers:
    use: false
    create: false
    share: false
    public: false
    configureObo: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  skills: false
  sharedLinks: false
  fileCitations: false

memory:
  disabled: true

registration:
  socialLogins: []

endpoints:
  custom:
    - name: 'woda-ai'
      apiKey: '${AI_ADAPTER_INTERNAL_KEY}'
      baseURL: 'http://ai-quota-adapter:4100/v1'
      headers:
        X-Adapter-Internal-Key: '${AI_ADAPTER_INTERNAL_KEY}'
        X-LibreChat-User-ID: '{{LIBRECHAT_USER_ID}}'
        X-LibreChat-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
        X-LibreChat-Conversation-ID: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-Message-ID: '{{LIBRECHAT_BODY_MESSAGEID}}'
      models:
        default:
          - 'kimi-k2'
        fetch: true
      titleConvo: false
      summarize: false
      modelDisplayLabel: '沃达 AI'
