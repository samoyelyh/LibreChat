version: 1.3.13
cache: true

interface:
  customWelcome: '欢迎使用沃达跨境电商AI平台'
  fileSearch: false
  modelSelect: true
  parameters: false
  presets: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  memories: false
  runCode: false
  webSearch: false
  agents:
    use: false
    create: false
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  skills: false
  sharedLinks: false
  fileCitations: false

memory:
  disabled: true

registration:
  socialLogins: []

mcpSettings:
  allowedAddresses:
    - 'sellersprite-mcp-gateway:4200'
    - 'lingxing-mcp-gateway:4300'

mcpServers:
  sellersprite-mcp:
    title: 'SellerSprite'
    description: 'Amazon ASIN、关键词、竞品、市场、趋势和评论数据'
    type: streamable-http
    url: 'http://sellersprite-mcp-gateway:4200/mcp'
    headers:
      X-MCP-Gateway-Key: '${SELLERSPRITE_MCP_INTERNAL_KEY}'
      X-LibreChat-User-ID: '{{LIBRECHAT_USER_ID}}'
      X-LibreChat-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
      X-LibreChat-User-Role: '{{LIBRECHAT_USER_ROLE}}'
      X-LibreChat-Conversation-ID: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      X-LibreChat-Message-ID: '{{LIBRECHAT_BODY_MESSAGEID}}'
    requiresOAuth: false
    timeout: 120000
    initTimeout: 30000
    serverInstructions: |
      卖家精灵提供 Amazon 第三方市场研究和估算数据。
      回答时必须区分外部第三方数据、外部估算数据与公司内部实际经营数据；
      不得把估算销量描述为真实订单销量。
  lingxing-mcp:
    title: 'Lingxing ERP'
    description: '公司内部店铺、Listing、库存、经营、财务、广告和监控数据'
    type: streamable-http
    url: 'http://lingxing-mcp-gateway:4300/mcp'
    headers:
      X-MCP-Gateway-Key: '${LINGXING_MCP_INTERNAL_KEY}'
      X-LibreChat-User-ID: '{{LIBRECHAT_USER_ID}}'
      X-LibreChat-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
      X-LibreChat-User-Role: '{{LIBRECHAT_USER_ROLE}}'
      X-LibreChat-Conversation-ID: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      X-LibreChat-Message-ID: '{{LIBRECHAT_BODY_MESSAGEID}}'
    requiresOAuth: false
    timeout: 120000
    initTimeout: 30000
    serverInstructions: |
      领星 ERP 数据属于公司内部真实经营数据，只能使用当前登录用户自己的领星密钥。
      Phase 4 仅允许读取当前角色和部门获授权的数据，所有创建、修改和删除工具均被网关拒绝。
      不得跨店铺、跨用户推断或披露未授权数据。

endpoints:
  custom:
    - name: 'woda-ai'
      apiKey: '${AI_ADAPTER_INTERNAL_KEY}'
      baseURL: 'http://ai-quota-adapter:4100/v1'
      headers:
        X-Adapter-Internal-Key: '${AI_ADAPTER_INTERNAL_KEY}'
        X-LibreChat-User-ID: '{{LIBRECHAT_USER_ID}}'
        X-LibreChat-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
        X-LibreChat-Conversation-ID: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
        X-LibreChat-Message-ID: '{{LIBRECHAT_BODY_MESSAGEID}}'
      models:
        default:
          - 'kimi-k2'
        fetch: true
      titleConvo: false
      summarize: false
      modelDisplayLabel: '沃达 AI'
