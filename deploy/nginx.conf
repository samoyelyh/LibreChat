map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $cookie_lang $default_lang_cookie {
    default '';
    '' 'lang=zh-Hans; Path=/; Max-Age=31536000; SameSite=Lax';
}

log_format phase1 '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
access_log /var/log/nginx/access.log phase1;

upstream librechat_api {
    server api:3080;
    keepalive 32;
}

upstream librechat_admin {
    server admin-panel:3000;
    keepalive 16;
}

upstream ai_quota_adapter {
    server ai-quota-adapter:4100;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;
    add_header Set-Cookie $default_lang_cookie always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        proxy_pass http://librechat_api/health;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://librechat_api/readyz;
        proxy_set_header Host $host;
    }

    # Only authenticated user-level balance/usage routes are exposed. The
    # adapter's OpenAI-compatible /v1 and internal health routes stay private.
    location = /api/ai-quota/balance {
        proxy_pass http://ai_quota_adapter/api/user/balance;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    location = /api/ai-quota/usage {
        proxy_pass http://ai_quota_adapter/api/user/usage$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://librechat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://librechat_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
