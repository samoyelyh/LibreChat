map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $cookie_lang $default_lang_cookie {
    default '';
    '' 'lang=zh-Hans; Path=/; Max-Age=31536000; SameSite=Lax';
}

log_format phase1 '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';
access_log /var/log/nginx/access.log phase1;

upstream librechat_api {
    server api:3080;
    keepalive 32;
}

upstream librechat_admin {
    server admin-panel:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;
    add_header Set-Cookie $default_lang_cookie always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        proxy_pass http://librechat_api/health;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://librechat_api/readyz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://librechat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://librechat_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
