name: woda-cross-border-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    image: nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      admin-panel:
        condition: service_healthy
      ai-quota-adapter:
        condition: service_healthy
      sellersprite-mcp-gateway:
        condition: service_healthy
      lingxing-mcp-gateway:
        condition: service_healthy
    ports:
      - '${USER_PORT:-7999}:80'
      - '3000:3000'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks:
      - edge
      - lingxing_control
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/health | grep -q OK']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    <<: *default-security

  api:
    image: ${LIBRECHAT_IMAGE:-ghcr.io/danny-avila/librechat-dev-api@sha256:91a1f259ee8902875f142c4efd3f36dd17fd87931f9f0070c059b952244b3694}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rag-api:
        condition: service_healthy
      ai-quota-adapter:
        condition: service_healthy
      sellersprite-mcp-gateway:
        condition: service_healthy
      lingxing-mcp-gateway:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      NODE_ENV: production
      AI_GATEWAY_ADMIN_TOKEN: ''
      AI_TOKEN_ENCRYPTION_KEY: ''
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/LibreChat?authSource=admin
      CUSTOM_FOOTER: ${CUSTOM_FOOTER:-}
      MEILI_HOST: http://meilisearch:7700
      RAG_API_URL: http://rag-api:${RAG_PORT:-8000}
      NO_PROXY: localhost,127.0.0.1,::1,mongodb,meilisearch,vectordb,rag-api,redis,ai-quota-adapter,sellersprite-mcp-gateway,lingxing-mcp-gateway,admin-panel,nginx
      no_proxy: localhost,127.0.0.1,::1,mongodb,meilisearch,vectordb,rag-api,redis,ai-quota-adapter,sellersprite-mcp-gateway,lingxing-mcp-gateway,admin-panel,nginx
    volumes:
      - ../config/librechat.yaml:/app/librechat.yaml:ro
      - ./seed-phase1-rbac.js:/app/deploy/seed-phase1-rbac.js:ro
      - ./verify-user-isolation.js:/app/deploy/verify-user-isolation.js:ro
      - ./verify-admin-api.js:/app/deploy/verify-admin-api.js:ro
      - ./list-phase2-user.js:/app/deploy/list-phase2-user.js:ro
      - ./seed-phase3-rbac.js:/app/deploy/seed-phase3-rbac.js:ro
      - ./verify-phase3-actors.js:/app/deploy/verify-phase3-actors.js:ro
      - ./verify-phase3-live.js:/app/deploy/verify-phase3-live.js:ro
      - ./seed-phase4-rbac.js:/app/deploy/seed-phase4-rbac.js:ro
      - ./verify-phase4-actors.js:/app/deploy/verify-phase4-actors.js:ro
      - ./seed-phase5-private-skills.js:/app/deploy/seed-phase5-private-skills.js:ro
      - ./agent-id-migration.js:/app/deploy/agent-id-migration.js:ro
      - ./phase6-tool-catalog.js:/app/deploy/phase6-tool-catalog.js:ro
      - ./seed-phase6-agents.js:/app/deploy/seed-phase6-agents.js:ro
      - ./verify-phase6-live-tools.js:/app/deploy/verify-phase6-live-tools.js:ro
      - ./verify-phase6-api.js:/app/deploy/verify-phase6-api.js:ro
      - ./verify-agent-chat.js:/app/deploy/verify-agent-chat.js:ro
      - ./verify-agent-attachments.js:/app/deploy/verify-agent-attachments.js:ro
      - ./backfill-agent-document-context.js:/app/deploy/backfill-agent-document-context.js:ro
      - ./gateway-signing.js:/app/deploy/gateway-signing.js:ro
      - ./verify-phase8-security.js:/app/deploy/verify-phase8-security.js:ro
      - ./verify-phase5-api.js:/app/deploy/verify-phase5-api.js:ro
      - ./verify-phase5-quota-api.js:/app/deploy/verify-phase5-quota-api.js:ro
      - images:/app/client/public/images
      - uploads:/app/uploads
      - api_logs:/app/api/logs
    networks:
      - edge
      - backend
      - mcp
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    labels:
      org.opencontainers.image.version: v0.8.7
      org.opencontainers.image.revision: 9e74cc0e57b395926122bd4062c1fcedc48ed465
    logging: *default-logging
    <<: *default-security

  admin-panel:
    image: ghcr.io/clickhouse/librechat-admin-panel@sha256:9a78851f84f448eab780ac658c4d17db51974c240492affc789a72d61e35f678
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      API_SERVER_URL: http://api:3080
      VITE_API_BASE_URL: ${DOMAIN_CLIENT}
      SESSION_COOKIE_SECURE: ${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
    networks:
      - edge
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging: *default-logging
    <<: *default-security

  mongodb:
    image: mongo@sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    restart: unless-stopped
    command: [mongod, --auth, --bind_ip_all]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./init-ai-adapter-mongo.js:/opt/woda/init-ai-adapter-mongo.js:ro
      - ./init-sellersprite-mongo.js:/opt/woda/init-sellersprite-mongo.js:ro
      - ./init-lingxing-mongo.js:/opt/woda/init-lingxing-mongo.js:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --host 127.0.0.1 --authenticationDatabase admin --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"'
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s
    logging: *default-logging
    <<: *default-security

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    entrypoint: [/usr/local/bin/woda-redis-entrypoint.sh]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./redis-entrypoint.sh:/usr/local/bin/woda-redis-entrypoint.sh:ro
      - redis_data:/data
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *default-logging
    <<: *default-security

  ai-quota-adapter:
    image: ${AI_ADAPTER_IMAGE:?Run deploy/build-ai-adapter.sh first}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AI_ADAPTER_HOST: 0.0.0.0
      AI_ADAPTER_PORT: ${AI_ADAPTER_PORT:-4100}
      AI_ADAPTER_INTERNAL_KEY: ${AI_ADAPTER_INTERNAL_KEY}
      AI_TOKEN_ENCRYPTION_KEY: ${AI_TOKEN_ENCRYPTION_KEY}
      AI_GATEWAY_ADMIN_TOKEN: ${AI_GATEWAY_ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      MONGO_URI: mongodb://${AI_ADAPTER_DB_USERNAME}:${AI_ADAPTER_DB_PASSWORD}@mongodb:27017/${AI_ADAPTER_DB_NAME:-ai_quota_adapter}?authSource=${AI_ADAPTER_DB_NAME:-ai_quota_adapter}
      AI_ADAPTER_LIBRECHAT_DB: LibreChat
      AI_ADAPTER_DB_NAME: ${AI_ADAPTER_DB_NAME:-ai_quota_adapter}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEW_API_BASE_URL: ${NEW_API_BASE_URL:-https://api.aso8ty.com/v1}
      NEW_API_ADMIN_USER_ID: ${NEW_API_ADMIN_USER_ID}
      NEW_API_REQUEST_TIMEOUT_MS: ${NEW_API_REQUEST_TIMEOUT_MS:-300000}
      AI_ADAPTER_BODY_LIMIT_BYTES: ${AI_ADAPTER_BODY_LIMIT_BYTES:-16777216}
      AI_ADAPTER_REQUESTS_PER_MINUTE: ${AI_ADAPTER_REQUESTS_PER_MINUTE:-30}
      AI_ADAPTER_MAX_CONCURRENT_REQUESTS: ${AI_ADAPTER_MAX_CONCURRENT_REQUESTS:-2}
      AI_ADAPTER_AUDIT_RETENTION_DAYS: ${AI_ADAPTER_AUDIT_RETENTION_DAYS:-90}
      AI_ADAPTER_SIGNATURE_TOLERANCE_MS: ${AI_ADAPTER_SIGNATURE_TOLERANCE_MS:-30000}
      AI_DEFAULT_USER_QUOTA: ${AI_DEFAULT_USER_QUOTA:-0}
      AI_DEFAULT_ALLOWED_MODELS: ${AI_DEFAULT_ALLOWED_MODELS:-gpt-5.6-sol}
      AI_ADAPTER_TEST_MODEL: ${AI_ADAPTER_TEST_MODEL:-gpt-5.6-sol}
      RUN_BILLABLE_PHASE2_TESTS: ${RUN_BILLABLE_PHASE2_TESTS:-false}
      NO_PROXY: localhost,127.0.0.1,::1,mongodb,redis
      no_proxy: localhost,127.0.0.1,::1,mongodb,redis
    networks:
      - edge
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:${AI_ADAPTER_PORT:-4100}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging
    <<: *default-security

  sellersprite-mcp-gateway:
    image: ${SELLERSPRITE_MCP_GATEWAY_IMAGE:?Run deploy/build-sellersprite-gateway.sh first}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SELLERSPRITE_MCP_GATEWAY_HOST: 0.0.0.0
      SELLERSPRITE_MCP_GATEWAY_PORT: ${SELLERSPRITE_MCP_GATEWAY_PORT:-4200}
      SELLERSPRITE_MCP_INTERNAL_KEY: ${SELLERSPRITE_MCP_INTERNAL_KEY}
      SELLERSPRITE_MCP_URL: ${SELLERSPRITE_MCP_URL:-https://mcp.sellersprite.com/mcp}
      SELLERSPRITE_MCP_SECRET_KEY: ${SELLERSPRITE_MCP_SECRET_KEY}
      SELLERSPRITE_MCP_MONGO_URI: mongodb://${SELLERSPRITE_MCP_DB_USERNAME}:${SELLERSPRITE_MCP_DB_PASSWORD}@mongodb:27017/${SELLERSPRITE_MCP_DB:-sellersprite_mcp_gateway}?authSource=${SELLERSPRITE_MCP_DB:-sellersprite_mcp_gateway}
      SELLERSPRITE_MCP_LIBRECHAT_DB: LibreChat
      SELLERSPRITE_MCP_DB: ${SELLERSPRITE_MCP_DB:-sellersprite_mcp_gateway}
      SELLERSPRITE_MCP_TIMEOUT_MS: ${SELLERSPRITE_MCP_TIMEOUT_MS:-120000}
      SELLERSPRITE_MCP_AUDIT_RETENTION_DAYS: ${SELLERSPRITE_MCP_AUDIT_RETENTION_DAYS:-365}
      SELLERSPRITE_MCP_MONTHLY_LIMIT: ${SELLERSPRITE_MCP_MONTHLY_LIMIT:-0}
      SELLERSPRITE_MCP_SIGNATURE_TOLERANCE_MS: ${SELLERSPRITE_MCP_SIGNATURE_TOLERANCE_MS:-30000}
      SELLERSPRITE_MCP_REQUESTS_PER_MINUTE: ${SELLERSPRITE_MCP_REQUESTS_PER_MINUTE:-60}
      NO_PROXY: localhost,127.0.0.1,::1,mongodb
      no_proxy: localhost,127.0.0.1,::1,mongodb
    networks:
      - backend
      - mcp
      - sellersprite_egress
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:${SELLERSPRITE_MCP_GATEWAY_PORT:-4200}/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging
    <<: *default-security

  lingxing-mcp-gateway:
    image: ${LINGXING_MCP_GATEWAY_IMAGE:?Run deploy/build-lingxing-gateway.sh first}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LINGXING_MCP_GATEWAY_HOST: 0.0.0.0
      LINGXING_MCP_GATEWAY_PORT: ${LINGXING_MCP_GATEWAY_PORT:-4300}
      LINGXING_MCP_INTERNAL_KEY: ${LINGXING_MCP_INTERNAL_KEY}
      LINGXING_MCP_ENCRYPTION_KEY: ${LINGXING_MCP_ENCRYPTION_KEY}
      LINGXING_MCP_URL: ${LINGXING_MCP_URL:-https://openmcp.lingxing.com/mcp-servers/lingxing-mcp}
      LINGXING_MCP_MONGO_URI: mongodb://${LINGXING_MCP_DB_USERNAME}:${LINGXING_MCP_DB_PASSWORD}@mongodb:27017/${LINGXING_MCP_DB:-lingxing_mcp_gateway}?authSource=${LINGXING_MCP_DB:-lingxing_mcp_gateway}
      LINGXING_MCP_LIBRECHAT_DB: LibreChat
      LINGXING_MCP_DB: ${LINGXING_MCP_DB:-lingxing_mcp_gateway}
      LINGXING_MCP_TIMEOUT_MS: ${LINGXING_MCP_TIMEOUT_MS:-120000}
      LINGXING_MCP_AUDIT_RETENTION_DAYS: ${LINGXING_MCP_AUDIT_RETENTION_DAYS:-365}
      LINGXING_MCP_SIGNATURE_TOLERANCE_MS: ${LINGXING_MCP_SIGNATURE_TOLERANCE_MS:-30000}
      LINGXING_MCP_REQUESTS_PER_MINUTE: ${LINGXING_MCP_REQUESTS_PER_MINUTE:-60}
      LINGXING_MCP_TOOL_INTERVAL_MS: ${LINGXING_MCP_TOOL_INTERVAL_MS:-1100}
      JWT_SECRET: ${JWT_SECRET}
      NO_PROXY: localhost,127.0.0.1,::1,mongodb
      no_proxy: localhost,127.0.0.1,::1,mongodb
    networks:
      - backend
      - mcp
      - lingxing_control
      - lingxing_egress
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:${LINGXING_MCP_GATEWAY_PORT:-4300}/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging
    <<: *default-security

  meilisearch:
    image: getmeili/meilisearch@sha256:8b57fc3c7f46535ddef3828df1538465ac19d892eb57c9a10da6df0880bd5856
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:7700/health | grep -q available']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging
    <<: *default-security

  vectordb:
    image: pgvector/pgvector@sha256:8809cfffff0082cf260c9ac752f1dd1afc77f6f0a55c4e6411321e78efc3d9a5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging
    <<: *default-security

  rag-api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite@sha256:c0ad82657b556c1e16dcfca85d045788f67caa223e25e70eb687f4d16b41dedc
    restart: unless-stopped
    depends_on:
      vectordb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: vectordb
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RAG_PORT: ${RAG_PORT:-8000}
      # The pinned RAG image rejects an explicitly empty provider. Keep the
      # service bootable in Phase 1 without adding an external model secret;
      # embeddings are not exposed until a later phase configures RAG.
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      # RAG is globally disabled for Phase 1. These non-secret, loopback-only
      # values satisfy startup validation and make accidental calls fail closed.
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-phase1-disabled-no-secret}
      RAG_OPENAI_BASEURL: ${RAG_OPENAI_BASEURL:-http://127.0.0.1:9/v1}
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${RAG_PORT:-8000}/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging: *default-logging
    <<: *default-security

networks:
  edge:
  backend:
    internal: true
  mcp:
    internal: true
  lingxing_control:
    internal: true
  sellersprite_egress:
  lingxing_egress:

volumes:
  mongodb_data:
  meili_data:
  postgres_data:
  images:
  uploads:
  api_logs:
  redis_data:
